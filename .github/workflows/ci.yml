name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Shared UI copies are in sync
        run: ./scripts/sync-ui.sh && git diff --exit-code
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Validate and test bundles
        run: |
          for d in plugins/*/; do
            claude plugin validate "$d"
            if [ -f "$d/hooks/hooks.json" ]; then claude plugin test "$d"; fi
          done
