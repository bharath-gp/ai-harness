name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Shared UI copies are in sync
        run: ./scripts/sync-ui.sh && git diff --exit-code
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Validate and test bundles
        run: |
          for d in plugins/*/; do
            claude plugin validate "$d"
            if [ -f "$d/hooks/hooks.json" ]; then claude plugin test "$d"; fi
          done
